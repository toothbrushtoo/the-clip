name: Clip
options:
  bundleIdPrefix: com.misha
  deploymentTarget:
    iOS: "17.0"
targets:
  Clip:
    type: application
    platform: iOS
    sources: [Clip]
    info:
      path: Clip/Info.plist
      properties:
        NSMotionUsageDescription: Clip uses the phone's motion sensor to count reps when no clip is connected.
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Clip connects to your rep sensor over Bluetooth.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misha.clip
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
