name: iOS build
on:
  push:
    paths: ['app/**', 'tools/rep_engine_check/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check rep engine against the Python reference
        run: |
          swiftc -O -o /tmp/repcheck app/Clip/RepEngine.swift tools/rep_engine_check/main.swift
          /tmp/repcheck hardware/data/phyphox,hardware/data/synthetic tools/rep_engine_check/reference.json
      - name: install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd app && xcodegen generate
      - name: Build unsigned
        run: |
          cd app
          xcodebuild -project Clip.xcodeproj -scheme Clip -configuration Release \
          -sdk iphoneos -destination 'generic/platform=iOS' \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
          build
      - name: Package IPA
        run: |
          cd app
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Clip.app Payload/
          zip -r Clip.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Clip-ipa
          path: app/Clip.ipa
          
   
    
